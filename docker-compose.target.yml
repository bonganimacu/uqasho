services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomrental
      POSTGRES_USER: roomrental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    volumes:
      - target-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomrental -d roomrental"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/roomrental
      JDBC_DATABASE_USERNAME: roomrental
      JDBC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  target-db:
