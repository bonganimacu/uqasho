{% extends "base.html" %}{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="authbox authbox-premium">
  <div class="authmark">RR</div>
  <p class="eyebrow">Account recovery</p>
  <h1>Choose a new password</h1>
  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New password<input name="password" type="password" minlength="8" placeholder="At least 8 characters" required></label>
    <button class="btn big" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
