{% extends "base.html" %}{% block title %}Reset password{% endblock %}
{% block content %}
<div class="authbox authbox-premium">
  <div class="authmark">RR</div>
  <p class="eyebrow">Account recovery</p>
  <h1>Reset your password</h1>
  <p class="authlead">Enter your account email and we will send a secure reset link.</p>
  <form method="post" action="/forgot-password">
    <label>Email<input name="email" type="email" placeholder="you@example.co.za" required></label>
    <button class="btn big" type="submit">Send reset link</button>
  </form>
  <p class="authfoot"><a href="/login">Return to login</a></p>
</div>
{% endblock %}
