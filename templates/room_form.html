{% extends "base.html" %}{% block title %}Add room{% endblock %}
{% block content %}
<h1>Add a room</h1>
<form class="formcard" method="post" enctype="multipart/form-data">
  <label>Room name <input name="name" required placeholder="e.g. Sunny en-suite room"></label>
  <div class="row">
    <label>Room type <select name="room_type">{% for t in room_types %}<option>{{ t }}</option>{% endfor %}</select></label>
    <label>Bathroom <select name="bathroom"><option value="private">Private</option><option value="shared">Shared</option></select></label>
    <label>Max occupants <input name="occupants" type="number" min="1" max="6" value="1"></label>
  </div>
  <div class="row">
    <label>Monthly rent (R) <input name="monthly_rent" type="number" min="100" max="100000" required></label>
    <label>Deposit (R) <input name="deposit" type="number" min="0" value="0"></label>
    <label>Additional fees (R) <input name="additional_fees" type="number" min="0" value="0"></label>
  </div>
  <div class="row">
    <label>Available from <input name="available_from" type="date"></label>
    <label class="check"><input type="checkbox" name="is_shared" value="1"> Shared room</label>
    <label class="check"><input type="checkbox" name="is_furnished" value="1"> Furnished</label>
  </div>
  <label>Description <textarea name="description" rows="4" placeholder="What's included, condition, vibe of the place…"></textarea></label>
  <label>Amenities (comma separated) <input name="amenities" placeholder="WiFi, Water, Electricity, Parking, Furnished"></label>
  <label>House rules <input name="rules" placeholder="No smoking, quiet hours…"></label>
  <label>Photos (first photo becomes the cover) <input name="images" type="file" accept="image/*" multiple></label>
  <button class="btn big" type="submit">Save room (draft)</button>
  <p class="muted">Tip: add at least one photo, then publish or submit for review.</p>
</form>
{% endblock %}
